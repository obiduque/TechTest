<div class="row">
  <div *ngIf="!showCreate" class="col-xl-12">
    <app-card cardTitle="User Table" [options]="false" blockClass="table-border-style">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Id</th>
              <th>Name</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody>
            @for (usuario of users(); track usuario.id) {
                <tr>
                <td>{{ usuario.id }}</td>
                <td>{{ usuario.nombre }}</td>
                <td>{{ usuario.correo }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="4">No hay usuarios registrados.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </app-card>
    <button type="button" class="btn btn-primary" (click)="showCreateBox(true)">Crear Usuario</button>
  </div>
  <div *ngIf="showCreate" class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow">
      <div class="d-flex flex-column gap-3">
        <form [formGroup]="userForm">
          <h3>Crear Usuario</h3>
          <div>
            <div class="form-group row">
              <label for="colFormLabelSm" class="col-sm-3 col-form-label col-form-label-sm">Nombre</label>
              <div class="col-sm-9">
                <input type="text" class="form-control form-control-sm" id="colFormLabelSm" 
                formControlName="nombre" placeholder="Nombre" />
              </div>
            </div>
            <div class="form-group row">
              <label for="colFormLabel" class="col-sm-3 col-form-label">Email</label>
              <div class="col-sm-9">
                <input type="email" class="form-control" id="colFormLabel" 
                formControlName="email" placeholder="Email" />
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center align-items-center">
            <button type="button" class="btn btn-primary" (click)="saveUser()"
            [disabled]="message()!==''">Crear</button>
            <button type="button" class="btn btn-primary" (click)="showCreateBox(false)">Volver</button>
          </div>
          <h5>{{message()}}</h5>
        </form>
      </div>
    </div>
  </div>
</div>
